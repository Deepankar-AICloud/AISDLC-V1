name: Agentic SDLC — Feedback Handler

# Processes safe, structured /agent commands from PR review comments and issue
# comments. Only an allowlisted command set is honored; arbitrary commands are
# never executed (prompt-injection mitigation).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: feedback-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  handle:
    # Ignore bot comments to prevent trigger loops.
    if: >-
      github.actor != 'github-actions[bot]' &&
      startsWith(github.event.comment.body, '/agent ')
    runs-on: ubuntu-latest
    steps:
      - name: Parse & validate command (allowlist)
        id: cmd
        run: |
          BODY="${{ github.event.comment.body }}"
          CMD="$(echo "$BODY" | sed -E 's#^/agent[[:space:]]+([a-zA-Z-]+).*#\1#')"
          case "$CMD" in
            revise|regenerate|rerun-qc|explain|status|impact) echo "valid=true"  >> "$GITHUB_OUTPUT" ;;
            *)                                                 echo "valid=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "name=$CMD" >> "$GITHUB_OUTPUT"
          # Capture free-text notes after the command (treated as DATA, not instructions).
          echo "$BODY" | sed -E 's#^/agent[[:space:]]+[a-zA-Z-]+[[:space:]]*##' > /tmp/notes.txt

      - name: Reject unknown commands
        if: steps.cmd.outputs.valid == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          NUM="${{ github.event.issue.number || github.event.pull_request.number }}"
          gh issue comment "$NUM" --body "❌ Unknown or disallowed command. Allowed: \`/agent revise|regenerate|rerun-qc|explain|status|impact\`."
          exit 0

      - name: Checkout
        if: steps.cmd.outputs.valid == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        if: steps.cmd.outputs.valid == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        if: steps.cmd.outputs.valid == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Install Copilot CLI
        if: steps.cmd.outputs.valid == 'true' && (steps.cmd.outputs.name == 'revise' || steps.cmd.outputs.name == 'regenerate')
        run: |
          curl -fsSL https://gh.io/copilot-install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Execute validated command
        if: steps.cmd.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          NUM="${{ github.event.issue.number || github.event.pull_request.number }}"
          python -m scripts.sdlc.feedback \
            --target "$NUM" \
            --command "${{ steps.cmd.outputs.name }}" \
            --notes-file /tmp/notes.txt

  # ── Model confirmation / override (separate from artifact approval) ──────
  model:
    # Handles /model approve | /model select <model> [reason] | /model compare | /model status
    if: >-
      github.actor != 'github-actions[bot]' &&
      startsWith(github.event.comment.body, '/model ')
    runs-on: ubuntu-latest
    steps:
      - name: Parse & validate model command (allowlist)
        id: cmd
        run: |
          BODY="${{ github.event.comment.body }}"
          SUB="$(echo "$BODY" | sed -E 's#^/model[[:space:]]+([a-zA-Z-]+).*#\1#')"
          case "$SUB" in
            approve|select|compare|status) echo "valid=true"  >> "$GITHUB_OUTPUT" ;;
            *)                              echo "valid=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "name=$SUB" >> "$GITHUB_OUTPUT"
          # For `select`, capture "<model> <reason...>" as DATA (not instructions).
          ARGS="$(echo "$BODY" | sed -E 's#^/model[[:space:]]+[a-zA-Z-]+[[:space:]]*##')"
          MODEL="$(echo "$ARGS" | awk '{print $1}')"
          REASON="$(echo "$ARGS" | cut -s -d' ' -f2-)"
          echo "model=$MODEL"   >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Reject unknown model command
        if: steps.cmd.outputs.valid == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          NUM="${{ github.event.issue.number || github.event.pull_request.number }}"
          gh issue comment "$NUM" --body "❌ Unknown model command. Allowed: \`/model approve\`, \`/model select <model> [reason]\`, \`/model compare\`, \`/model status\`."
          exit 0

      - name: Checkout
        if: steps.cmd.outputs.valid == 'true'
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Python
        if: steps.cmd.outputs.valid == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        if: steps.cmd.outputs.valid == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Restore pending model state
        if: steps.cmd.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow "Agentic SDLC Orchestrator" --limit 50 \
            --json databaseId,displayTitle,status \
            --jq "[.[] | select(.displayTitle == \"Agentic SDLC issue #$ISSUE_NUMBER\" and .status == \"completed\")][0].databaseId // empty")"
          if [[ -z "$RUN_ID" ]]; then
            echo "No completed orchestrator run found for issue #$ISSUE_NUMBER."
            exit 1
          fi
          mkdir -p .sdlc
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "sdlc-state-issue-$ISSUE_NUMBER" --dir .sdlc
          test -f ".sdlc/issue-$ISSUE_NUMBER.json"

      - name: Apply model decision
        id: decision
        if: steps.cmd.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          NUM="${{ github.event.issue.number || github.event.pull_request.number }}"
          SUB="${{ steps.cmd.outputs.name }}"
          if [ "$SUB" = "status" ] || [ "$SUB" = "compare" ]; then
            # Surface the pending recommendation back to the thread.
            REC=$(python - "$NUM" <<'PY'
          import json, sys
          from scripts.sdlc.orchestrator.state_store import load_state
          st = load_state(int(sys.argv[1]), "")
          print(json.dumps((st.pending_model_confirmation if st else None) or {"info": "no pending model confirmation"}, indent=2))
          PY
          )
            gh issue comment "$NUM" --body $'**Model recommendation**\n```json\n'"$REC"$'\n```\nReply `/model approve` or `/model select <model> [reason]`.'
            exit 0
          fi

          if [ "$SUB" = "approve" ]; then
            OUT=$(python -m scripts.sdlc.model_confirm --issue "$NUM")
          else
            OUT=$(python -m scripts.sdlc.model_confirm --issue "$NUM" \
              --model "${{ steps.cmd.outputs.model }}" \
              --reason "${{ steps.cmd.outputs.reason }}")
          fi
          CONFIRMED=$(printf '%s' "$OUT" | python -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("ok"))).lower())')
          if [ "$CONFIRMED" != "true" ]; then
            echo "$OUT"
            exit 1
          fi
          echo "confirmed=true" >> "$GITHUB_OUTPUT"
          gh issue comment "$NUM" --body $'✅ Model decision recorded:\n```json\n'"$OUT"$'\n```\nResuming the stage…'

      - name: Save confirmed model state
        if: steps.decision.outputs.confirmed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-state-issue-${{ github.event.issue.number || github.event.pull_request.number }}
          path: .sdlc/issue-${{ github.event.issue.number || github.event.pull_request.number }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Resume orchestrator with confirmed state
        if: steps.decision.outputs.confirmed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          STATE_RUN_ID: ${{ github.run_id }}
        run: |
          gh workflow run agentic-sdlc.yml --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field issue_number="$ISSUE_NUMBER" \
            --field state_run_id="$STATE_RUN_ID"
