name: Agentic SDLC — Feedback Handler

# Processes safe, structured /agent and /model commands from PR review comments
# and issue comments. Only an allowlisted command set is honored; arbitrary
# commands are never executed (prompt-injection mitigation).
#
# Security rules for this file:
# - Comment text is untrusted. It reaches shell only through `env:` variables,
#   never through `${{ github.event.comment.body }}` inside `run:` scripts.
# - Only the first line is parsed, and only validated values are written to
#   $GITHUB_OUTPUT (a newline in an output value could forge other outputs).
#   Free text (notes, reasons) goes through files.
# - Only users with write, maintain or admin access may run commands (checked
#   with the GitHub permission API; failures deny).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: feedback-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  # ── Who may issue commands ────────────────────────────────────────────────
  authorize:
    # Ignore bot comments to prevent trigger loops.
    if: >-
      github.actor != 'github-actions[bot]' &&
      (startsWith(github.event.comment.body, '/agent ') || startsWith(github.event.comment.body, '/model '))
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.perm.outputs.allowed }}
    steps:
      - name: Check commenter has write access
        id: perm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENTER_TYPE: ${{ github.event.comment.user.type }}
        run: |
          ALLOWED=false
          PERM=none
          if [[ "$COMMENTER_TYPE" == "User" && "$COMMENTER" =~ ^[A-Za-z0-9-]{1,39}$ ]]; then
            PERM="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${COMMENTER}/permission" --jq .permission 2>/dev/null || echo none)"
            case "$PERM" in
              admin|maintain|write) ALLOWED=true ;;
            esac
          fi
          echo "Commenter permission: ${PERM}; allowed=${ALLOWED}"
          echo "allowed=${ALLOWED}" >> "$GITHUB_OUTPUT"

      - name: Explain refusal
        if: steps.perm.outputs.allowed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$TARGET_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "❌ AISDLC commands need write access to this repository. The command was ignored."

  handle:
    needs: authorize
    if: >-
      needs.authorize.outputs.allowed == 'true' &&
      startsWith(github.event.comment.body, '/agent ')
    runs-on: ubuntu-latest
    steps:
      - name: Parse & validate command (allowlist)
        id: cmd
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          FIRST_LINE="$(printf '%s\n' "$COMMENT_BODY" | head -n 1 | tr -d '\r')"
          CMD=""
          if [[ "$FIRST_LINE" =~ ^/agent[[:space:]]+([a-z-]+)([[:space:]]|$) ]]; then
            CMD="${BASH_REMATCH[1]}"
          fi
          case "$CMD" in
            revise|regenerate|rerun-qc|explain|status|impact)
              echo "valid=true" >> "$GITHUB_OUTPUT"
              echo "name=$CMD" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "valid=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
          # Free-text notes after the command (treated as DATA, not instructions).
          # First line after the command word, plus any following lines.
          {
            printf '%s\n' "$FIRST_LINE" | sed -E 's#^/agent[[:space:]]+[a-z-]+[[:space:]]*##'
            printf '%s\n' "$COMMENT_BODY" | tail -n +2
          } > "$RUNNER_TEMP/notes.txt"

      - name: Reject unknown commands
        if: steps.cmd.outputs.valid == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$TARGET_NUMBER" --repo "$GITHUB_REPOSITORY" --body "❌ Unknown or disallowed command. Allowed: \`/agent revise|regenerate|rerun-qc|explain|status|impact\`."

      - name: Checkout
        if: steps.cmd.outputs.valid == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        if: steps.cmd.outputs.valid == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        if: steps.cmd.outputs.valid == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Install Copilot CLI
        if: steps.cmd.outputs.valid == 'true' && (steps.cmd.outputs.name == 'revise' || steps.cmd.outputs.name == 'regenerate')
        run: |
          curl -fsSL https://gh.io/copilot-install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Execute validated command
        if: steps.cmd.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COMMAND_NAME: ${{ steps.cmd.outputs.name }}
        run: |
          python -m scripts.sdlc.feedback \
            --target "$TARGET_NUMBER" \
            --command "$COMMAND_NAME" \
            --notes-file "$RUNNER_TEMP/notes.txt"

  # ── Model confirmation / override (separate from artifact approval) ──────
  model:
    # Handles /model approve | /model select <model> [reason] | /model compare | /model status
    needs: authorize
    if: >-
      needs.authorize.outputs.allowed == 'true' &&
      startsWith(github.event.comment.body, '/model ')
    runs-on: ubuntu-latest
    steps:
      - name: Parse & validate model command (allowlist)
        id: cmd
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          FIRST_LINE="$(printf '%s\n' "$COMMENT_BODY" | head -n 1 | tr -d '\r')"
          SUB=""
          MODEL=""
          REASON=""
          if [[ "$FIRST_LINE" =~ ^/model[[:space:]]+([a-z]+)([[:space:]]+([^[:space:]]+))?([[:space:]]+(.*))?$ ]]; then
            SUB="${BASH_REMATCH[1]}"
            MODEL="${BASH_REMATCH[3]}"
            REASON="${BASH_REMATCH[5]}"
          fi
          VALID=false
          case "$SUB" in
            approve|compare|status) VALID=true ;;
            select)
              # Model ids are plain identifiers; anything else is refused.
              if [[ "$MODEL" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,79}$ ]]; then VALID=true; fi
              ;;
          esac
          echo "valid=$VALID" >> "$GITHUB_OUTPUT"
          if [[ "$VALID" == "true" ]]; then
            echo "name=$SUB" >> "$GITHUB_OUTPUT"
            echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          fi
          # The reason is free text (DATA): kept in a file, never in an output or expression.
          printf '%s' "$REASON" > "$RUNNER_TEMP/model-reason.txt"

      - name: Reject unknown model command
        if: steps.cmd.outputs.valid == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$TARGET_NUMBER" --repo "$GITHUB_REPOSITORY" --body "❌ Unknown model command. Allowed: \`/model approve\`, \`/model select <model> [reason]\`, \`/model compare\`, \`/model status\`."

      - name: Checkout
        if: steps.cmd.outputs.valid == 'true'
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Python
        if: steps.cmd.outputs.valid == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        if: steps.cmd.outputs.valid == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Restore pending model state
        if: steps.cmd.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=sdlc-state-issue-$ISSUE_NUMBER&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty')"
          if [[ -z "$RUN_ID" ]]; then
            echo "No completed orchestrator run found for issue #$ISSUE_NUMBER."
            exit 1
          fi
          mkdir -p .sdlc
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "sdlc-state-issue-$ISSUE_NUMBER" --dir .sdlc
          test -f ".sdlc/issue-$ISSUE_NUMBER.json"

      - name: Apply model decision
        id: decision
        if: steps.cmd.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          SUB: ${{ steps.cmd.outputs.name }}
          MODEL: ${{ steps.cmd.outputs.model }}
        run: |
          NUM="$TARGET_NUMBER"
          if [ "$SUB" = "status" ] || [ "$SUB" = "compare" ]; then
            # Surface the pending recommendation back to the thread.
            REC=$(python - "$NUM" <<'PY'
          import json, sys
          from scripts.sdlc.orchestrator.state_store import load_state
          st = load_state(int(sys.argv[1]), "")
          print(json.dumps((st.pending_model_confirmation if st else None) or {"info": "no pending model confirmation"}, indent=2))
          PY
          )
            gh issue comment "$NUM" --body $'**Model recommendation**\n```json\n'"$REC"$'\n```\nReply `/model approve` or `/model select <model> [reason]`.'
            exit 0
          fi

          if [ "$SUB" = "approve" ]; then
            OUT=$(python -m scripts.sdlc.model_confirm --issue "$NUM") || true
          else
            REASON="$(cat "$RUNNER_TEMP/model-reason.txt")"
            OUT=$(python -m scripts.sdlc.model_confirm --issue "$NUM" \
              --model "$MODEL" \
              --reason "$REASON") || true
          fi
          CONFIRMED=$(printf '%s' "$OUT" | python -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("ok"))).lower())' 2>/dev/null || echo false)
          if [ "$CONFIRMED" != "true" ]; then
            echo "$OUT"
            gh issue comment "$NUM" --body $'❌ Model decision not applied:\n```json\n'"$OUT"$'\n```\nThe stage is not waiting for model confirmation. Wait for a new recommendation comment, then reply `/model approve`.'
            exit 1
          fi
          echo "confirmed=true" >> "$GITHUB_OUTPUT"
          gh issue comment "$NUM" --body $'✅ Model decision recorded:\n```json\n'"$OUT"$'\n```\nResuming the stage…'

      - name: Save confirmed model state
        if: steps.decision.outputs.confirmed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-state-issue-${{ github.event.issue.number || github.event.pull_request.number }}
          path: |
            .sdlc/issue-${{ github.event.issue.number || github.event.pull_request.number }}.json
            .sdlc/issue-${{ github.event.issue.number || github.event.pull_request.number }}-*.patch
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Resume orchestrator with confirmed state
        if: steps.decision.outputs.confirmed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          STATE_RUN_ID: ${{ github.run_id }}
        run: |
          gh workflow run agentic-sdlc.yml --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field issue_number="$ISSUE_NUMBER" \
            --field state_run_id="$STATE_RUN_ID"
