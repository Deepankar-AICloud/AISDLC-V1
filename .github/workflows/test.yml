name: Agentic SDLC Python Validation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-validation:
    name: Python orchestrator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q scripts

      - name: Run deterministic orchestrator smoke check
        run: >-
          python -m scripts.sdlc.run
          --no-llm
          --selection-mode AUTO
          --context "Business problem: Validate SDLC automation in CI. Business objective: Confirm the deterministic workflow runs without external model calls. Stakeholders: Engineering team. Scope: CI smoke test only. Constraints: No LLM calls. Source reference: ISSUE 1."
