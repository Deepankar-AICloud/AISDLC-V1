name: Security — Secret Scan

on:
  pull_request:
    branches: [main]
    paths: ['src/**', '.github/workflows/security.yml']
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'   # weekly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
