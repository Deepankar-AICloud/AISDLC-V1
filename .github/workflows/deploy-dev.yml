name: Deploy — DEV

# Deploys SmartServe to the DEV App Service after an approved merge to main.
# Uses OIDC federated auth (no long-lived secrets) + Managed Identity.

on:
  push:
    branches: [main]
    paths: ['src/**', 'infra/**', '.github/workflows/deploy-dev.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # OIDC federated login to Azure

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision/Update infrastructure (Bicep)
        id: infra
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP_DEV }}
          template: infra/main.bicep
          parameters: >-
            infra/dev.parameters.json
            entraTenantId=${{ secrets.AZURE_TENANT_ID }}
            entraClientId=${{ vars.ENTRA_API_CLIENT_ID }}
          deploymentName: smartserve-dev
          failOnStdErr: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish backend
        working-directory: src/backend
        run: dotnet publish SmartServe.Api/SmartServe.Api.csproj -c Release -o ${{ github.workspace }}/publish

      - name: Deploy backend to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.infra.outputs.apiAppName }}
          package: ${{ github.workspace }}/publish

      - name: Setup Node & build frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        working-directory: src/frontend
        env:
          VITE_API_BASE_URL: ${{ steps.infra.outputs.apiUrl }}
          VITE_ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.ENTRA_SPA_CLIENT_ID }}
          VITE_API_SCOPE: api://${{ vars.ENTRA_API_CLIENT_ID }}/access_as_user
        run: |
          npm ci || npm install
          npm run build --if-present

      - name: Deploy frontend to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.infra.outputs.webAppName }}
          package: src/frontend/dist

      - name: Smoke test
        env:
          API: ${{ steps.infra.outputs.apiUrl }}
          WEB: ${{ steps.infra.outputs.webUrl }}
        run: |
          # /health requires a bearer token (no anonymous endpoints), so 401 proves the API
          # started, which includes applying EF migrations against Azure SQL.
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$API/health" || true)
            echo "API $API/health -> $code (attempt $attempt/30)"
            [[ "$code" == "401" || "$code" == "200" ]] && break
            [[ $attempt == 30 ]] && { echo "DEV smoke test FAILED — not proceeding."; exit 1; }
            sleep 20
          done
          curl --fail -s -o /dev/null --retry 10 --retry-delay 15 --retry-all-errors "$WEB/" \
            || { echo "DEV frontend not reachable — not proceeding."; exit 1; }
          echo "DEV deployed: web $WEB, api $API"
