name: Deploy — DEV

# Deploys SmartServe to the DEV App Service after an approved merge to main.
# Uses OIDC federated auth (no long-lived secrets) + Managed Identity.

on:
  push:
    branches: [main]
    paths: ['src/**', 'infra/**', '.github/workflows/deploy-dev.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # OIDC federated login to Azure

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision/Update infrastructure (Bicep)
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP_DEV }}
          template: infra/main.bicep
          parameters: infra/dev.parameters.json
          failOnStdErr: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish backend
        working-directory: src/backend
        run: dotnet publish -c Release -o ${{ github.workspace }}/publish

      - name: Deploy backend to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_API_APP_DEV }}
          package: ${{ github.workspace }}/publish

      - name: Setup Node & build frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        working-directory: src/frontend
        run: |
          npm ci || npm install
          npm run build --if-present

      - name: Deploy frontend to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEB_APP_DEV }}
          package: src/frontend/dist

      - name: Smoke test
        run: |
          API="${{ secrets.AZURE_API_URL_DEV }}"
          echo "Health check: $API/health"
          curl --fail --retry 5 --retry-delay 10 "$API/health" || {
            echo "DEV smoke test FAILED — not proceeding."; exit 1; }
