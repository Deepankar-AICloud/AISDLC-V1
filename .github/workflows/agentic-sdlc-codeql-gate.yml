name: Agentic SDLC CodeQL Gate

on:
  issues:
    types: [labeled, edited]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [CodeQL]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: >-
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'sdlc:start') ||
      (github.event_name == 'issues' && github.event.action == 'edited' && github.event.changes.body != null && github.event.issue.pull_request == null && github.event.sender.login != 'github-actions' && github.event.sender.login != 'github-actions[bot]') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.user.login != 'github-actions' && github.event.comment.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch eligible requirement issues
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CODEQL_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR_LOGIN: ${{ github.event.comment.user.login || github.event.sender.login }}
          RESUME: ${{ github.event_name == 'issue_comment' || github.event.action == 'edited' }}
        run: |
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"

          if [[ "$RESUME" == "true" ]]; then
            if [[ "$COMMENT_AUTHOR_LOGIN" == "github-actions" || "$COMMENT_AUTHOR_LOGIN" == "github-actions[bot]" ]]; then
              echo "Ignoring GitHub Actions comment."
              exit 0
            fi
            case "$COMMENT_BODY" in
              /model*|/agent*)
                echo "Ignoring workflow command comment."
                exit 0
                ;;
            esac
            ISSUE_STATE="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
            if [[ "$ISSUE_STATE" != "OPEN" ]]; then
              echo "Issue #$ISSUE_NUMBER is closed; not resuming SDLC."
              exit 0
            fi
            LABELS="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json labels --jq '[.labels[].name] | join(",")')"
            if [[ ",$LABELS," != *",sdlc:awaiting-info,"* ]]; then
              echo "Issue #$ISSUE_NUMBER is not waiting for information."
              exit 0
            fi
            CODEQL_SHA="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow CodeQL --branch main --limit 1 \
              --json headSha,conclusion \
              --jq '.[0] | select(.conclusion == "success") | .headSha')"
            if [[ "$CODEQL_SHA" != "$MAIN_SHA" ]]; then
              echo "CodeQL has not succeeded for current main commit $MAIN_SHA."
              exit 1
            fi
            STATE_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.name == \"sdlc-state-issue-$ISSUE_NUMBER\" and .expired == false)][0].workflow_run.id // empty")"
            if [[ -z "$STATE_RUN_ID" ]]; then
              echo "No saved SDLC state found for issue #$ISSUE_NUMBER."
              exit 1
            fi
            ISSUES="$ISSUE_NUMBER"
          elif [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$CODEQL_SHA" != "$MAIN_SHA" ]]; then
              echo "Ignoring stale CodeQL result for $CODEQL_SHA; main is $MAIN_SHA."
              exit 0
            fi
            ISSUES="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --label sdlc:start --limit 100 --json number --jq '.[].number')"
            if [[ -z "$ISSUES" ]]; then
              TITLE="SDLC intake for CodeQL commit $MAIN_SHA"
              EXISTING_ISSUE="$(gh issue list --repo "$GITHUB_REPOSITORY" \
                --state all --search "$MAIN_SHA in:title" --limit 1 \
                --json number --jq '.[0].number // empty')"
              if [[ -z "$EXISTING_ISSUE" ]]; then
                cat > /tmp/sdlc-intake.md <<EOF
          Opened after CodeQL passed on main.

          Commit: $MAIN_SHA

          No product context is recorded here yet. Add it to this description. The orchestrator will wait for details instead of inferring them.
          EOF
                ISSUE_URL="$(gh issue create --repo "$GITHUB_REPOSITORY" \
                  --title "$TITLE" --body-file /tmp/sdlc-intake.md \
                  --label sdlc:start)"
                ISSUES="${ISSUE_URL##*/}"
              else
                echo "An intake issue already exists for $MAIN_SHA (#$EXISTING_ISSUE)."
              fi
            fi
          else
            CODEQL_SHA="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow CodeQL --branch main --limit 1 \
              --json headSha,conclusion \
              --jq '.[0] | select(.conclusion == "success") | .headSha')"
            if [[ "$CODEQL_SHA" != "$MAIN_SHA" ]]; then
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "SDLC is queued: CodeQL must succeed for the current main commit before generation starts. The workflow resumes automatically after CodeQL passes."
              echo "Issue #$ISSUE_NUMBER remains queued until CodeQL succeeds for main."
              exit 0
            fi
            ISSUES="$ISSUE_NUMBER"
          fi

          while IFS= read -r issue; do
            [[ -z "$issue" ]] && continue
            LABELS="$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" \
              --json labels --jq '[.labels[].name] | join(",")')"
            if [[ "$RESUME" == "true" ]]; then
              if ! gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" \
                --remove-label sdlc:awaiting-info; then
                echo "Could not clear awaiting-info label from issue #$issue."
                exit 1
              fi
              if ! gh workflow run agentic-sdlc.yml --repo "$GITHUB_REPOSITORY" \
                --ref main --field issue_number="$issue" \
                --field state_run_id="$STATE_RUN_ID"; then
                gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" \
                  --add-label sdlc:awaiting-info
                exit 1
              fi
              echo "Resumed Agentic SDLC for issue #$issue after human context comment."
              continue
            fi
            if [[ ",$LABELS," != *",sdlc:start,"* ]]; then
              continue
            fi

            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --remove-label sdlc:start
            if ! gh workflow run agentic-sdlc.yml --repo "$GITHUB_REPOSITORY" \
              --ref main --field issue_number="$issue"; then
              gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --add-label sdlc:start
              exit 1
            fi
            echo "Dispatched Agentic SDLC for issue #$issue after CodeQL success."
          done <<< "$ISSUES"
