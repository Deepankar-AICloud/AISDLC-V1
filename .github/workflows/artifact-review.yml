name: Agentic SDLC — Artifact Review & Resume

# When a human approves an SDLC artifact PR, advance the orchestrator to the
# next stage. When they merge, mark the stage approved. This is the human gate
# that resumes orchestration.

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue whose current stage was already approved (e.g. PR merged before resume was automated)"
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: artifact-review-${{ github.event.pull_request.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  gate:
    # A merge without an approving review is also treated as approval. If the PR
    # was already approved, the review run advanced the stage, so skip it here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       startsWith(github.event.pull_request.head.ref, 'sdlc/issue-')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'sdlc/issue-'))
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Skip merges already handled by an approving review
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PROCEED=true
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            APPROVALS="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
              --jq '[.[] | select(.state == "APPROVED")] | length')"
            if [[ "$APPROVALS" -gt 0 ]]; then
              echo "PR #$PR_NUMBER was approved; the review run already advanced the stage."
              PROCEED=false
            fi
          fi
          echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"

  resume:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Merged PR branches may already be deleted, so use main for merges.
          ref: ${{ github.event_name == 'pull_request_review' && github.event.pull_request.head.ref || 'main' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Derive issue number from branch
        id: meta
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          if [[ -n "$INPUT_ISSUE" ]]; then
            ISSUE="$INPUT_ISSUE"
          else
            ISSUE="$(echo "$BRANCH" | sed -E 's#sdlc/issue-([0-9]+)/.*#\1#')"
          fi
          [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "::error::Invalid issue number '$ISSUE'."; exit 1; }
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

      - name: Restore issue state
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.meta.outputs.issue }}
        run: |
          RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=sdlc-state-issue-$ISSUE_NUMBER&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty')"
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::No saved SDLC state found for issue #$ISSUE_NUMBER."
            exit 1
          fi
          mkdir -p .sdlc
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "sdlc-state-issue-$ISSUE_NUMBER" --dir .sdlc
          test -f ".sdlc/issue-$ISSUE_NUMBER.json"

      - name: Mark stage approved & advance state
        id: approval
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.meta.outputs.issue }}
          REVIEWER: ${{ github.event.review.user.login || github.actor }}
        run: |
          python -m scripts.sdlc.approve --issue "$ISSUE_NUMBER" --reviewer "$REVIEWER" \
            | tee /tmp/approval.txt
          NEXT_STAGE="$(sed -E 's/.* -> //' /tmp/approval.txt)"
          echo "next_stage=$NEXT_STAGE" >> "$GITHUB_OUTPUT"

      - name: Save approved state
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-state-issue-${{ steps.meta.outputs.issue }}
          path: |
            .sdlc/issue-${{ steps.meta.outputs.issue }}.json
            .sdlc/issue-${{ steps.meta.outputs.issue }}-*.patch
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Merge the approved artifact PR
        if: github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch || \
            echo "Merge deferred (branch protection may require additional checks)."

      - name: Trigger next stage
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.meta.outputs.issue }}
        run: |
          gh workflow run agentic-sdlc.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f issue_number="$ISSUE_NUMBER" \
            -f state_run_id="${{ github.run_id }}"

      - name: Notify issue participants that the stage advanced
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.meta.outputs.issue }}
          NEXT_STAGE: ${{ steps.approval.outputs.next_stage }}
        run: |
          cat > /tmp/approval-notification.md <<EOF
          ## ✅ Artifact approved

          Issue #${ISSUE_NUMBER}: the artifact was approved. The next pipeline stage is **${NEXT_STAGE}**.

          The next stage has been queued.
          EOF
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/approval-notification.md
